; ====================================================================
; Upload & Request Size Configuration for Large File Uploads
; Copy these settings to your local php.ini and AWS server php.ini
; ====================================================================

; Maximum allowed size of uploaded files.
; Default: 2M
upload_max_filesize = 50M

; Maximum size of POST data that PHP will accept.
; Must be equal to or larger than upload_max_filesize
; Default: 8M
post_max_size = 50M

; This sets the maximum amount of memory in bytes that a script is allowed to allocate
; Default: 128M (increase for large file processing)
memory_limit = 256M

; Maximum execution time of each script, in seconds
; Default: 30 (increase if needed for large file uploads)
max_execution_time = 300

; Maximum amount of time each script may spend parsing request data
; Default: -1 (unlimited)
max_input_time = 300

; How many input variables may be accepted (limit is applied to $_GET, $_POST and $_COOKIE combined)
; Default: 1000
max_input_vars = 5000

; ====================================================================
; IMPORTANT: After editing php.ini, restart PHP-FPM or web server
; ====================================================================
;
; On XAMPP (Windows):
;   - Stop Apache from XAMPP Control Panel
;   - Start Apache again
;
; On Linux/AWS EC2:
;   sudo systemctl restart php-fpm
;   OR
;   sudo systemctl restart php8.1-fpm
;
; On Elastic Beanstalk:
;   Deploy to automatically apply changes
;
; ====================================================================
